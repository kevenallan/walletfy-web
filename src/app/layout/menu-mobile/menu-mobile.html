<div class="flex items-center">
    <img src="images/logo_walletfy.png" alt="Logo" class="w-8 h-8 object-contain" />

    <h1 class="text-2xl text-verde font-bold pl-2">Walletfy</h1>
</div>

<div class="flex flex-col h-[90%]">
    <nav class="mt-4">
        <ul>
            <li class="cursor-pointer rounded p-2" routerLink="/dashboard">
                <a class="text-branco">
                    <i class="pi pi-chart-bar mr-3"></i>
                    Dashboard
                </a>
            </li>

            <li class="cursor-pointer rounded p-2" routerLink="/conta">
                <a class="text-branco">
                    <i class="pi pi-building-columns mr-3"></i>
                    Contas
                </a>
            </li>

            <li class="cursor-pointer rounded p-2" routerLink="/cartao">
                <a class="text-branco">
                    <i class="pi pi-building-columns mr-3"></i>
                    Cartões
                </a>
            </li>

            <li class="cursor-pointer rounded p-2" routerLink="/receita">
                <a class="text-branco">
                    <i class="pi pi-calculator mr-3"></i>
                    Receita
                </a>
            </li>

            <li class="cursor-pointer rounded p-2" routerLink="/gasto">
                <a class="text-branco">
                    <i class="pi pi-wallet mr-3"></i>
                    Gastos
                </a>
            </li>

            <li class="cursor-pointer rounded p-2" routerLink="/categoria">
                <a class="text-branco">
                    <i class="pi pi-tag mr-3"></i>
                    Categorias
                </a>
            </li>

            <li class="cursor-pointer rounded p-2">
                <a class="text-branco">
                    <i class="pi pi-cog mr-3"></i>
                    Configurações
                </a>
            </li>
        </ul>
    </nav>

    <footer class="mt-auto">
        <div class="flex-1 h-px bg-cinza w-full my-3"></div>
        <div class="flex items-center gap-3">
            <div
                class="bg-verde-suave rounded-full w-8 h-8 md:w-12 md:h-12 flex justify-center items-center"
            >
                <i class="pi pi-user text-verde text-lg md:text-2xl!"></i>
            </div>
            <div>
                <p class="text-branco">Fulano</p>

                <p class="text-cinza text-xs md:text-sm cursor-pointer" routerLink="perfil/editar">
                    Ver perfil
                </p>
            </div>
        </div>
        <div class="flex-1 h-px bg-cinza w-full my-3"></div>

        <div class="mt-5 cursor-pointer rounded p-2">
            <button class="text-branco flex items-center w-full" (click)="sair.emit()">
                <i class="pi pi-sign-out text-branco mr-3"></i>Sair
            </button>
        </div>
    </footer>
</div>
