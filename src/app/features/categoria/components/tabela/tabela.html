<div class="shadow-lg">
    <p-table
        #dt2
        [value]="categorias()"
        [paginator]="true"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="['nome']"
        [size]="tableSize"
        [totalRecords]="categorias().length"
        [showCurrentPageReport]="!isMobile"
        currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros"
    >
        <ng-template #caption>
            <div class="flex">
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        type="text"
                        (input)="dt2.filterGlobal($event.target.value, 'contains')"
                        placeholder="Buscar por categoria"
                    />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th class="text-center!" pSortableColumn="nome" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Categoria
                        <p-sortIcon field="nome" />
                    </div>
                </th>
                <th class="text-center!">Icone</th>
                <th class="text-center!">Cor</th>
                <th class="text-center!" pSortableColumn="ativo" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Ativo
                        <p-sortIcon field="ativo" />
                    </div>
                </th>
                <th class="text-center!" style="width: 15%">Ações</th>
            </tr>
        </ng-template>
        <ng-template #body let-categoria>
            <tr>
                <td class="text-center!">{{ categoria.nome }}</td>
                <td class="text-center!">
                    <div
                        class="mx-auto rounded-lg w-8 h-8 md:rounded-2xl md:w-10 md:h-10 flex justify-center items-center"
                        [style.background-color]="categoria.cor"
                    >
                        <i
                            [ngClass]="['pi', categoria.icone, 'text-lg!', 'lg:text-2xl!']"
                            [style.color]="'white'"
                        ></i>
                    </div>
                </td>
                <td class="text-center!">
                    <div class="w-5 h-5 mx-auto" [style.background-color]="categoria.cor"></div>
                </td>
                <td class="text-center!">{{ categoria.ativo ? 'Sim' : 'Não' }}</td>
                <td>
                    <div class="flex justify-center gap-3">
                        <button
                            class="group cursor-pointer h-10 w-10 bg-branco-puro border border-cinza-claro hover:bg-azul rounded-lg shadow-md"
                            (click)="editar.emit(categoria)"
                        >
                            <i class="pi pi-pen-to-square text-azul group-hover:text-branco!"></i>
                        </button>
                        <button
                            class="group cursor-pointer h-10 w-10 bg-branco-puro border border-cinza-claro hover:bg-vermelho rounded-lg shadow-md"
                            (click)="deletar.emit(categoria.id)"
                        >
                            <i class="pi pi-trash text-vermelho group-hover:text-branco!"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
