<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Categorias</h1>
    <p class="text-gray-500 ml-5 md:mt-2">
        Crie e gerencie as categorias utilizadas nos seus gastos.
    </p>

    <div class="flex justify-end mr-3 my-1 md:my-3">
        <p-button
            icon="pi pi-plus"
            [label]="isMobile ? '' : 'Nova Categoria'"
            (click)="abrirForm()"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600"
        />
    </div>

    <section>
        <app-card></app-card>
    </section>

    <main>
        <app-tabela [categorias]="categorias" (editar)="abrirForm($event)"></app-tabela>
    </main>
</div>
