<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Categorias</h1>
    <p class="text-cinza-escuro ml-5 md:mt-2">
        Crie e gerencie as categorias utilizadas nos seus gastos.
    </p>

    <div class="flex justify-end mr-3 my-1 md:my-3">
        <p-button
            icon="pi pi-plus"
            [label]="isMobile ? '' : 'Nova Categoria'"
            (click)="abrirForm()"
            styleClass="bg-verde-escuro! border-verde-escuro! hover:!bg-verde dark:bg-verde! hover:bg-verde-claro!"
        />
    </div>

    <section>
        <app-card [resumo]="resumoCards()"></app-card>
    </section>

    <main>
        <p-tabs [(value)]="abaSelecionada" (valueChange)="listar(); listarResumo()" class="mr-3">
            <p-tablist>
                <p-tab [value]="abaDespesa">Despesa</p-tab>
                <p-tab value="RECEITA">Receita</p-tab>
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="DESPESA">
                    <app-tabela
                        [categorias]="categorias()"
                        (editar)="abrirForm($event)"
                        (deletar)="deletar($event)"
                    ></app-tabela>
                </p-tabpanel>
                <p-tabpanel [value]="abaReceita">
                    <app-tabela
                        [categorias]="categorias()"
                        (editar)="abrirForm($event)"
                        (deletar)="deletar($event)"
                    ></app-tabela>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </main>
</div>
