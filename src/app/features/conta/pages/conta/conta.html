<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl md:text-4xl">Contas</h1>
    <p class="text-cinza-escuro md:mt-2">Gerencie suas contas e acompanhe seus saldos.</p>

    <p-button label="Ver resumo" link (click)="verResumo = !verResumo" [class.hidden]="!isMobile" />

    <div class="hidden md:flex md:justify-end md:my-5">
        <p-button
            icon="pi pi-plus"
            label="Nova Conta"
            styleClass="bg-verde-escuro! border-verde-escuro! hover:!bg-verde dark:bg-verde! hover:bg-verde-claro!"
            (click)="abrirForm()"
        />
    </div>

    <div class="fixed bottom-1 right-1 z-100 md:hidden">
        <p-button
            icon="pi pi-plus"
            size="large"
            styleClass="bg-verde-escuro! border-verde-escuro! hover:!bg-verde dark:bg-verde! hover:bg-verde-claro!"
            (click)="abrirForm()"
        />
    </div>

    <section>
        <app-card [class.hidden]="!verResumo && isMobile" />
    </section>

    <main>
        <app-tabela [contas]="contaResponseDTO()" (editar)="abrirForm($event)"></app-tabela>
    </main>
</div>
