<main class="shadow-lg">
    <p-table
        #dt2
        [value]="contasComLabel()"
        [paginator]="true"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="['nome']"
        [size]="tableSize"
        [totalRecords]="contasComLabel().length"
        [showCurrentPageReport]="!isMobile"
        currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros"
    >
        <ng-template #caption>
            <div class="flex">
                <p-iconfield iconPosition="left" class="mr-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        type="text"
                        (input)="dt2.filterGlobal($event.target.value, 'contains')"
                        placeholder="Buscar por conta"
                    />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th class="text-center!" pSortableColumn="nome" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Nome
                        <p-sortIcon field="nome" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="tipo" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Tipo
                        <p-sortIcon field="tipo" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="saldo" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Saldo
                        <p-sortIcon field="saldo" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="ativo" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Ativo
                        <p-sortIcon field="ativo" />
                    </div>
                </th>
                <th class="text-center!" style="width: 15%">Ações</th>
            </tr>
        </ng-template>
        <ng-template #body let-conta>
            <tr>
                <td class="flex gap-2 items-center">
                    <img
                        [src]="conta.imagemConta"
                        [alt]="conta.banco?.nome ?? conta.tipo"
                        class="border border-cinza w-10 h-10 rounded-lg"
                    />
                    {{ conta.nome }}
                </td>
                <td class="text-center!">
                    {{ conta.tipoLabel }}
                </td>
                <td class="text-center!">
                    {{ conta.saldo | currency: 'BRL' }}
                </td>
                <td class="text-center!">{{ conta.ativo ? 'Sim' : 'Não' }}</td>
                <td>
                    <div class="flex justify-center gap-3">
                        <button
                            class="group cursor-pointer h-10 w-10 bg-branco-puro border border-cinza-claro hover:bg-azul rounded-lg shadow-md"
                            (click)="editar.emit(conta)"
                        >
                            <i class="pi pi-pen-to-square text-azul group-hover:text-branco!"></i>
                        </button>
                        <button
                            class="group cursor-pointer h-10 w-10 bg-branco-puro border border-cinza-claro hover:bg-vermelho rounded-lg shadow-md"
                            (click)="deletar.emit(conta.id)"
                        >
                            <i class="pi pi-trash text-vermelho group-hover:text-branco!"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</main>
