<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl md:text-4xl">Perfil</h1>
    <p class="text-cinza md:mt-2">Atualize suas informações pessoais.</p>

    <app-informacoes-pessoais [dadosInfo]="dadosInfoPessoais()"></app-informacoes-pessoais>

    <app-seguranca></app-seguranca>

    <footer>
        <div class="flex justify-end gap-3 py-3">
            <p-button
                icon="pi pi-trash"
                label="Excluir conta"
                styleClass="bg-vermelho! border-vermelho! hover:bg-vermelho-claro!"
                (click)="excluirConta()"
            />

            <p-button
                icon="pi pi-times"
                label="Cancelar"
                styleClass="bg-cinza-escuro! border-cinza-escuro! dark:bg-cinza-escuro! hover:bg-cinza!"
                (click)="cancelar()"
            />

            <p-button
                icon="pi pi-save"
                label="Salvar"
                styleClass="bg-verde-escuro! border-verde-escuro! dark:bg-verde! hover:bg-verde-claro! w-28"
                (click)="salvar()"
            />
        </div>
    </footer>
</div>
