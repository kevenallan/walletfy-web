<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Perfil</h1>
    <p class="text-cinza ml-5 md:mt-2">Atualize suas informações pessoais.</p>

    <app-informacoes-pessoais></app-informacoes-pessoais>

    <app-seguranca></app-seguranca>

    <footer>
        <div class="flex justify-end gap-3 py-3 px-2 md:mr-3">
            <p-button
                icon="pi pi-times"
                label="Cancelar"
                severity="secondary"
                styleClass="bg-cinza-claro!"
            />

            <p-button
                icon="pi pi-save"
                label="Salvar"
                styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
                (click)="salvar()"
            />
        </div>
    </footer>
</div>
