<main>
    <div
        class="bg-white dark:bg-gray-800 dark:shadow-black shadow-lg gap-3 rounded-lg mt-3 md:mt-8 mx-2 md:mx-5"
    >
        <div class="flex items-center">
            <i class="pi pi-user-edit pl-3 pt-2 text-lg md:text-2xl!"></i>
            <p class="text-base md:text-lg font-semibold pl-2 pt-2">Informações pessoais</p>
        </div>

        <div class="flex-1 h-px bg-gray-300 mt-2"></div>

        <div class="p-5 grid grid-cols-2 md:grid-cols-3 gap-2">
            <div class="col-span-2 md:col-span-1 row-span-2 flex flex-col items-center">
                <p class="text-base">Foto de perfil</p>
                <div
                    class="bg-green-100 rounded-full w-12 h-12 md:w-24 md:h-24 flex justify-center items-center"
                >
                    <i class="pi pi-user text-green-600 text-lg md:text-4xl!"></i>
                </div>
                <p class="text-sm">JPG, PNG ou GIF. Máx: 2MB.</p>
            </div>

            <div>
                <label for="nome">Nome completo</label>

                <input
                    id="nome"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="Digite seu nome completo"
                />
            </div>

            <div>
                <label for="email">E-mail</label>

                <input
                    id="email"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="seu@email.com"
                />
            </div>

            <div>
                <label for="telefone">Telefone</label>

                <input
                    id="telefone"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="Digite seu telefone"
                />
            </div>

            <div>
                <label for="dataNascimento">Data de Nascimento</label>
                <p-iconfield>
                    <p-inputicon class="pi pi-envelope" />
                    <p-datepicker
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        dateFormat="dd/mm/yy"
                        inputId="dataNascimento"
                        placeholder="dd/mm/aaaa"
                        class="w-full"
                    />
                </p-iconfield>
            </div>

            <!-- <div>
                <label for="cpf">CPF</label>

                <input
                    id="cpf"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="Digite seu CPF"
                />
            </div> -->
        </div>
    </div>
</main>
