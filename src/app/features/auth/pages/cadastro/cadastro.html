<div
    class="grid justify-center grid-rows-[auto_1fr] md:grid md:justify-stretch md:grid-cols-4 md:grid-rows-[auto_1fr_auto] min-h-screen"
>
    <app-cabecalho></app-cabecalho>

    <app-resumo class="hidden md:flex md:row-start-2 md:col-span-2 h-full"></app-resumo>

    <app-form-cadastro
        class="flex items-center justify-center w-full bg-surface-100 md:row-start-2 md:col-start-3 md:col-span-2"
        (formOutput)="cadastrar($event)"
    ></app-form-cadastro>

    <app-rodape
        class="hidden md:flex justify-center! md:row-start-3 md:col-span-4 w-full mb-3"
    ></app-rodape>
</div>
