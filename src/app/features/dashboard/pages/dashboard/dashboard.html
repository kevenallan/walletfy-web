<main>
    <h1 class="font-bold text-2xl md:text-4xl">Resumo Anual</h1>
    <p class="text-cinza-escuro md:mt-2">
        Acompanhe a evolução das suas receitas e gastos ao longo do ano.
    </p>
    <div class="grid grid-cols-1 lg:grid-cols-2 mt-5 mb-10 gap-5 ">
        <app-grafico [dados]="dadosReceitas" titulo="Evolução das Receitas" cor="#16a34a" />
        <app-grafico [dados]="dadosDespesas" titulo="Evolução dos Gastos" cor="#dc2626" />
    </div>
    <app-tabela [resumoAnual]="resumoAnualResponseDTO()" (dataOutput)="listar($event)" />
</main>
