<main>
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Resumo Anual</h1>
    <p class="text-gray-500 ml-5 md:mt-2">
        Acompanhe a evolução das suas receitas e gastos ao longo do ano.
    </p>
    <div class="flex justify-evenly flex-wrap mt-5 mb-10 gap-5">
        <app-grafico [dados]="dadosReceitas" titulo="Evolução das Receitas" cor="#16a34a" />
        <app-grafico [dados]="dadosDespesas" titulo="Evolução dos Gastos" cor="#dc2626" />
    </div>
    <app-tabela [resumoAnual]="resumoAnualResponseDTO()" />
</main>
