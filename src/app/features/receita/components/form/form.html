<main class="">
    <div class="bg-white dark:bg-gray-800 dark:shadow-black p-3 shadow-lg rounded-lg">
        <form [formGroup]="form">
            <div class="">
                <div class="">
                    <label for="descricao" class="font-semibold"
                        >Descrição <span class="text-vermelho">*</span></label
                    >
                    <input
                        id="descricao"
                        formControlName="descricao"
                        class="w-full"
                        type="text"
                        pInputText
                        placeholder="ex.: Salário"
                    />
                </div>

                <div class="">
                    <label for="valor" class="font-semibold"
                        >Valor <span class="text-vermelho">*</span></label
                    >

                    <p-inputnumber
                        id="valor"
                        formControlName="valor"
                        mode="currency"
                        currency="BRL"
                        locale="pt-BR"
                        class="w-full"
                        placeholder="R$1621 ,00"
                    />
                </div>

                <div class="">
                    <label for="categoria" class="font-semibold"
                        >Categoria <span class="text-vermelho">*</span></label
                    >
                    <p-select
                        inputId="categoria"
                        [options]="categorias()"
                        formControlName="categoria"
                        optionLabel="nome"
                        optionValue="id"
                        placeholder="Selecione uma categoria"
                        class="w-full"
                    />
                </div>

                <div class="">
                    <label for="formaPagamento" class="md:hidden font-semibold"
                        >Pagamento <span class="text-vermelho">*</span></label
                    >
                    <label for="formaPagamento" class="hidden md:inline font-semibold"
                        >Forma de Pagamento <span class="text-vermelho">*</span></label
                    >
                    <p-select
                        inputId="formaPagamento"
                        [options]="formaPagamento()"
                        formControlName="formaPagamento"
                        optionLabel="nome"
                        optionValue="id"
                        placeholder="Selecione a forma de pagamento"
                        class="w-full"
                    />
                </div>

                <div class="">
                    <label for="status" class="font-semibold"
                        >Status <span class="text-vermelho">*</span></label
                    >
                    <p-select
                        inputId="status"
                        [options]="statusReceita()"
                        formControlName="status"
                        optionLabel="nome"
                        optionValue="id"
                        placeholder="Selecione o status"
                        class="w-full"
                    >
                        <ng-template pTemplate="selectedItem" let-item>
                            {{ item?.nome | lowercase | titlecase }}
                        </ng-template>
                        <ng-template pTemplate="item" let-item>
                            {{ item.nome | lowercase | titlecase }}
                        </ng-template>
                    </p-select>
                </div>

                <div class="">
                    <div class="">
                        <label for="dataReceita" class="font-semibold truncate">
                            Data do Receita <span class="text-vermelho">*</span></label
                        >
                        <p-datepicker
                            formControlName="dataReceita"
                            [iconDisplay]="'input'"
                            [showIcon]="true"
                            dateFormat="dd/mm/yy"
                            inputId="dataReceita"
                            placeholder="dd/mm/aaaa"
                            class="w-full"
                        />
                    </div>
                </div>
            </div>
        </form>

        <hr class="mt-3 text-cinza-claro" />

        <!-- <div class="flex justify-end gap-3 py-3 px-2">
            <p-button
                icon="pi pi-arrow-left"
                label="Voltar"
                severity="secondary"
                (click)="voltar()"
            />
        </div> -->
        <p-button
            icon="pi pi-save"
            label="Salvar"
            (click)="salvar()"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
        />
    </div>
</main>
