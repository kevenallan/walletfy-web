<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Receitas</h1>
    <p class="text-cinza-escuro ml-5 md:mt-2">Gerencie todas as suas receitas registradas.</p>

    <p-button label="Ver resumo" link (click)="verResumo = !verResumo" [class.hidden]="!isMobile" />

    <div class="hidden md:flex md:justify-end md:mr-2 md:my-5">
        <p-button
            icon="pi pi-plus"
            [label]="isMobile ? '' : 'Nova Receita'"
            styleClass="bg-verde-escuro! border-verde-escuro! hover:!bg-verde-escuro dark:bg-verde-escuro! hover:bg-verde-claro!"
            (click)="abrirForm()"
        />
    </div>

    <div class="fixed bottom-1 right-1 z-100 md:hidden">
        <p-button
            icon="pi pi-plus"
            size="large"
            styleClass="bg-verde-escuro! border-verde-escuro! hover:!bg-verde-escuro dark:bg-verde-escuro! hover:bg-verde-claro!"
            (click)="abrirForm()"
        />
    </div>

    <app-receita-card
        [class.hidden]="!verResumo && isMobile"
        [resumoMeses]="resumoMeses()"
    ></app-receita-card>

    <app-tabela
        [receitaResponseDTO]="receitas()"
        (receitaEditarOutput)="abrirForm($event)"
        (receitaDeletarOutput)="deletarReceita($event)"
        (datasEmissaoOutput)="buscarReceitaPorData($event)"
    ></app-tabela>
</div>
