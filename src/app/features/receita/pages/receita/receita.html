<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Receitas</h1>
    <p class="text-cinza ml-5 md:mt-2">Gerencie todas as suas receitas registradas.</p>

    <div class="hidden md:flex md:justify-end md:mr-2 md:my-5">
        <p-button
            icon="pi pi-plus"
            [label]="isMobile ? '' : 'Nova Receita'"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            (click)="abrirForm()"
        />
    </div>

    <div class="fixed bottom-1 right-1 z-100 md:hidden">
        <p-button
            icon="pi pi-plus"
            size="large"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            (click)="abrirForm()"
        />
    </div>

    <app-receita-card [resumoMeses]="resumoMeses()"></app-receita-card>

    <app-tabela
        [receitaResponseDTO]="receitas()"
        (receitaEditarOutput)="abrirForm($event)"
        (receitaDeletarOutput)="deletarReceita($event)"
        (datasEmissaoOutput)="buscarReceitaPorData($event)"
    ></app-tabela>
</div>
