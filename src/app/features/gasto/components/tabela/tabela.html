<div class="shadow-lg md:mr-3">
    <p-table
        #dt2
        [value]="gastosComCor()"
        [paginator]="true"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="['descricao', 'categoria.nome', 'formaPagamento.nome', 'status.nome']"
        showGridlines
        stripedRows
        [size]="'small'"
        [sortField]="'dataGasto'"
        [sortOrder]="1"
    >
        <ng-template #caption>
            <div class="flex">
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        type="text"
                        (input)="dt2.filterGlobal($event.target.value, 'contains')"
                        placeholder="Buscar gasto..."
                    />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th class="text-center!" pSortableColumn="dataGasto" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Data
                        <p-sortIcon field="data" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="descricao" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Descrição
                        <p-sortIcon field="descricao" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="categoria.nome" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Categoria
                        <p-sortIcon field="categoria" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="formaPagamento.nome" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Forma de Pagamento
                        <p-sortIcon field="formaPagamento" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="status.nome" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Status
                        <p-sortIcon field="status" />
                    </div>
                </th>
                <!-- @IF -->
                <th class="text-center!" pSortableColumn="vencimento" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Vencimento
                        <p-sortIcon field="vencimento" />
                    </div>
                </th>
                <th class="text-center!" pSortableColumn="valor" style="width: 20%">
                    <div class="flex items-center justify-center gap-2">
                        Valor
                        <p-sortIcon field="valor" />
                    </div>
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template #body let-gasto>
            <tr>
                <td class="text-center!">{{ gasto.dataGasto | date: 'dd/MM/yyyy' }}</td>
                <td class="flex items-center justify-start h-full">
                    <div
                        class="rounded-lg w-8 h-8 md:rounded-2xl md:w-10 md:h-10 flex justify-center items-center mr-2"
                        [style.background-color]="gasto.categoria.cor"
                    >
                        <i
                            [ngClass]="['pi', gasto.categoria.icone, 'text-lg!', 'lg:text-2xl!']"
                            [style.color]="'white'"
                        ></i>
                    </div>
                    <p>{{ gasto.descricao }}</p>
                </td>
                <td class="text-center!">
                    <p-tag
                        [value]="gasto.categoria.nome"
                        [style]="{ 'background-color': gasto.categoria.cor, color: '#FFFFFF' }"
                    />
                </td>
                <td class="text-center!">
                    <p-tag
                        [value]="gasto.formaPagamento.nome"
                        [ngClass]="gasto.corFormaPagamento"
                    />
                </td>
                <td class="text-center!">
                    <p-tag
                        icon="pi pi-circle-on"
                        [value]="gasto.status.nome | titlecase"
                        [ngClass]="[
                            ...gasto.corStatus.split(' '),
                            'inline-flex',
                            'items-center',
                            'justify-center',
                            'gap-1.5',
                        ]"
                    />
                </td>
                <td class="text-center!">{{ gasto.dataVencimento | date: 'dd/MM/yyyy' }}</td>
                <td class="text-center!">{{ gasto.valor | currency: 'BRL' }}</td>
                <td class="text-center!">
                    <button class="cursor-pointer">
                        <i class="pi pi-pen-to-square"></i>
                    </button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
