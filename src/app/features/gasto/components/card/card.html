<div class="hidden lg:flex justify-evenly flex-wrap lg:gap-4 md:my-5 md:mb-10">
    @for (card of cardsParaExibicao(); track card.titulo) {
        <div
            class="bg-white dark:bg-gray-800 dark:shadow-black shadow-lg px-3 grid grid-rows-3 items-center grid-cols-[auto_1fr_auto] py-2 w-70 h-24"
        >
            <div
                [ngClass]="card.backgroundIcone"
                class="row-span-3 rounded-full w-13 h-13 flex justify-center items-center mr-2"
            >
                <i [ngClass]="[card.icone, card.corIcone]" class="text-2xl!"></i>
            </div>
            <h2 class="row-start-1 col-start-2 text-sm font-semibold">{{ card.titulo }}</h2>
            <p class="row-start-2 col-start-2 text-2xl font-bold">
                {{ card.valor | currency: 'BRL' }}
            </p>
            <p
                class="row-start-3 col-start-2 text-sm flex items-center justify-start mt-1"
                [ngClass]="card.corIcone"
            >
                <i class="pi pi-chevron-up text-lg! mr-2" [ngClass]="card.corIcone"></i
                >{{ card.descricao }}
            </p>
        </div>
    }
</div>
