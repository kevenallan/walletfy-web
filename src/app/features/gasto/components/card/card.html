<div class="hidden lg:flex justify-evenly flex-wrap lg:gap-4 md:my-5">
    <p-carousel
        [value]="resumoMeses()"
        [numVisible]="1"
        [numScroll]="1"
        [circular]="false"
        [responsiveOptions]="responsiveOptions"
        [page]="5"
        class="hidden lg:block w-full"
    >
        <ng-template #item let-resumo>
            <div class="flex flex-col items-center gap-2 px-4 pb-3">
                <h2 class="text-lg font-semibold text-cinza mb-2">
                    {{ resumo.mes + '-01' | date: 'MMMM yyyy' : '' : 'pt-BR' | titlecase }}
                </h2>

                <div class="flex justify-evenly flex-wrap gap-4 w-full">
                    @for (card of getCardsDoMes(resumo); track card.titulo) {
                        <div
                            class="bg-white dark:bg-gray-800 dark:shadow-black shadow-lg rounded-lg px-3 grid grid-rows-3 items-center grid-cols-[auto_1fr_auto] py-2 w-70 h-24"
                        >
                            <div
                                [ngClass]="card.background"
                                class="row-span-3 rounded-full w-13 h-13 flex justify-center items-center mr-2"
                            >
                                <i [ngClass]="[card.icone, card.corIcone]" class="text-2xl!"></i>
                            </div>

                            <h3 class="row-start-1 col-start-2 text-sm font-semibold">
                                {{ card.titulo }}
                            </h3>

                            <p class="row-start-2 col-start-2 text-2xl font-bold">
                                {{ card.valor | currency: 'BRL' }}
                            </p>

                            <p
                                class="row-start-3 col-start-2 text-sm flex items-center"
                                [ngClass]="card.corVariacao"
                            >
                                <i [ngClass]="[card.iconeVariacao, 'text-lg!', 'mr-2']"></i>
                                {{ card.descricao }}
                            </p>
                        </div>
                    }
                </div>
            </div>
        </ng-template>
    </p-carousel>
</div>
