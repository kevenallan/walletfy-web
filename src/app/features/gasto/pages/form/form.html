<div class="flex flex-col">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Novo Gasto</h1>
    <p class="hidden md:inline text-cinza ml-5 md:mt-2">
        Registre um novo gasto para manter suas finanças organizadas.
    </p>
</div>

<main class="md:mt-10 p-3">
    <div class="shadow-lg bg-white gap-3">
        <div class="flex flex-col md:flex-row">
            <div class="px-3 py-2">
                <label for="email">Descrição</label>

                <input
                    id="email"
                    autocomplete="email"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="seu@email.com"
                />
            </div>

            <div class="px-3 py-2">
                <label for="email">Valor</label>

                <input
                    id="email"
                    autocomplete="email"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="seu@email.com"
                />
            </div>

            <div class="flex flex-col px-3 py-2">
                <label for="categoria">Categoria</label>
                <!-- [ngModel]="icone()"
                    (ngModelChange)="icone.set($event)" -->
                <p-select [options]="[]" optionLabel="label">
                    <ng-template let-item pTemplate="selectedItem">
                        <div class="flex items-center">
                            <i [class]="item?.value"></i>
                            <span>{{ item?.label }}</span>
                        </div>
                    </ng-template>

                    <ng-template let-item pTemplate="item">
                        <div class="flex items-center gap-2">
                            <i [class]="item.value"></i>
                            <span>{{ item.label }}</span>
                        </div>
                    </ng-template>
                </p-select>
            </div>

            <div class="flex flex-col px-3 py-2">
                <label for="formaPagamento">Forma de pagamento</label>
                <!-- [ngModel]="icone()"
                    (ngModelChange)="icone.set($event)" -->
                <p-select [options]="[]" optionLabel="label">
                    <ng-template let-item pTemplate="selectedItem">
                        <div class="flex items-center gap-2">
                            <i [class]="item?.value"></i>
                            <span>{{ item?.label }}</span>
                        </div>
                    </ng-template>

                    <ng-template let-item pTemplate="item">
                        <div class="flex items-center gap-2">
                            <i [class]="item.value"></i>
                            <span>{{ item.label }}</span>
                        </div>
                    </ng-template>
                </p-select>
            </div>

            <div class="flex">
                <div class="flex-auto px-3 py-2 w-50">
                    <label for="icondisplay" class="font-bold block mb-2"> Data do Gasto </label>
                    <p-datepicker
                        [(ngModel)]="date2"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        inputId="icondisplay"
                    />
                </div>

                <div class="flex-auto px-3 py-2 w-50">
                    <label for="icondisplay" class="font-bold block mb-2"> Vencimento </label>
                    <p-datepicker
                        [(ngModel)]="date2"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        inputId="icondisplay"
                    />
                </div>
            </div>

            <div class="flex flex-col px-3 py-2">
                <label for="status">Status</label>
                <!-- [ngModel]="icone()"
                    (ngModelChange)="icone.set($event)" -->
                <p-select [options]="[]" optionLabel="label">
                    <ng-template let-item pTemplate="selectedItem">
                        <div class="flex items-center gap-2">
                            <i [class]="item?.value"></i>
                            <span>{{ item?.label }}</span>
                        </div>
                    </ng-template>

                    <ng-template let-item pTemplate="item">
                        <div class="flex items-center gap-2">
                            <i [class]="item.value"></i>
                            <span>{{ item.label }}</span>
                        </div>
                    </ng-template>
                </p-select>
            </div>
        </div>

        <hr class="mt-3 text-cinza-claro" />

        <div class="flex justify-end gap-3 py-3 px-2">
            <p-button label="Cancelar" severity="secondary" />

            <p-button
                icon="pi pi-save"
                label="Salvar "
                styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            />
        </div>
    </div>
</main>
