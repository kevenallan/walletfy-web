<div class="flex flex-col">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">
        <button (click)="voltar()">
            <i class="pi pi-arrow-left mr-3 md:hidden!"></i></button
        >Novo Gasto
    </h1>

    <p class="hidden md:inline text-cinza ml-5 md:mt-2">
        Registre um novo gasto para manter suas finanças organizadas.
    </p>
</div>

<main class="md:mt-8 p-3">
    <div class="bg-white dark:bg-gray-800 dark:shadow-black shadow-lg gap-3 rounded-lg">
        <div class="grid grid-cols-2 p-2 gap-2 md:grid-cols-3">
            <div class="col-span-2 md:col-span-1">
                <label for="descricao" class="font-semibold"
                    >Descrição <span class="text-vermelho">*</span></label
                >

                <input
                    id="descricao"
                    [ngModel]="descricao()"
                    (ngModelChange)="descricao.set($event)"
                    class="w-full"
                    type="text"
                    pInputText
                    placeholder="ex.: Almoço no shopping"
                />
            </div>

            <div class="col-span-2 md:col-span-1">
                <label for="valor" class="font-semibold"
                    >Valor <span class="text-vermelho">*</span></label
                >

                <p-inputnumber
                    id="valor"
                    [ngModel]="valor()"
                    (ngModelChange)="valor.set($event)"
                    mode="currency"
                    currency="BRL"
                    locale="pt-BR"
                    class="w-full"
                    placeholder="R$150,00"
                />
            </div>

            <div class="col-span-2 md:col-span-1">
                <label for="categoria" class="font-semibold"
                    >Categoria <span class="text-vermelho">*</span></label
                >
                <p-select
                    inputId="categoria"
                    [options]="categorias()"
                    [ngModel]="categoriaSelecionada()"
                    (ngModelChange)="categoriaSelecionada.set($event)"
                    optionLabel="nome"
                    placeholder="Selecione uma categoria"
                    class="w-full"
                />
            </div>

            <div class="">
                <label for="formaPagamento" class="md:hidden font-semibold"
                    >Pagamento <span class="text-vermelho">*</span></label
                >
                <label for="formaPagamento" class="hidden md:inline font-semibold"
                    >Forma de Pagamento <span class="text-vermelho">*</span></label
                >
                <p-select
                    inputId="formaPagamento"
                    [options]="formaPagamento()"
                    [ngModel]="formaPagamentoSelecionada()"
                    (ngModelChange)="formaPagamentoSelecionada.set($event)"
                    optionLabel="nome"
                    placeholder="Selecione a forma de pagamento"
                    class="w-full"
                />
            </div>

            <div class="">
                <label for="status" class="font-semibold"
                    >Status <span class="text-vermelho">*</span></label
                >
                <p-select
                    inputId="status"
                    [options]="statusGasto()"
                    [ngModel]="statusGastoSelecionado()"
                    (ngModelChange)="statusGastoSelecionado.set($event)"
                    optionLabel="nome"
                    placeholder="Selecione o status"
                    class="w-full"
                >
                    <ng-template pTemplate="selectedItem" let-item>
                        {{ item?.nome | titlecase }}
                    </ng-template>
                    <ng-template pTemplate="item" let-item>
                        {{ item.nome | titlecase }}
                    </ng-template>
                </p-select>
            </div>

            <div class="col-span-2 grid grid-cols-2 gap-2 md:col-span-1">
                <div class="">
                    <label for="dataGasto" class="font-semibold truncate">
                        Data do Gasto <span class="text-vermelho">*</span></label
                    >
                    <p-datepicker
                        [ngModel]="dataGasto()"
                        (ngModelChange)="dataGasto.set($event)"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        dateFormat="dd/mm/yy"
                        inputId="dataGasto"
                        placeholder="dd/mm/aaaa"
                        class="w-full"
                    />
                </div>

                <div class="">
                    <label for="dataVencimento" class="font-semibold"> Vencimento </label>
                    <p-datepicker
                        [ngModel]="dataVencimento()"
                        (ngModelChange)="dataVencimento.set($event)"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        dateFormat="dd/mm/yy"
                        inputId="dataVencimento"
                        placeholder="dd/mm/aaaa"
                        class="w-full"
                    />
                </div>
            </div>
        </div>

        <hr class="mt-3 text-cinza-claro" />

        <div class="flex justify-end gap-3 py-3 px-2">
            <p-button label="Cancelar" severity="secondary" (click)="voltar()" />

            <p-button
                icon="pi pi-save"
                label="Salvar"
                (click)="cadastrar()"
                styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            />
        </div>
    </div>
</main>
