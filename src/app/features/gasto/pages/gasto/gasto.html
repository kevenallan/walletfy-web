<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Gastos</h1>
    <p class="text-cinza ml-5 md:mt-2">Gerencie todos os seus gastos registrados.</p>

    <p-button label="Ver resumo" link (click)="verResumo = !verResumo" [class.hidden]="!isMobile" />

    <div class="hidden md:flex md:justify-end md:mr-2 md:my-5">
        <p-button
            icon="pi pi-plus"
            [label]="isMobile ? '' : 'Novo Gasto'"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            (click)="cadastrarAtualizarGasto()"
        />
    </div>

    <div class="fixed bottom-1 right-1 z-100 md:hidden">
        <p-button
            icon="pi pi-plus"
            size="large"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            (click)="cadastrarAtualizarGasto()"
        />
    </div>

    <section>
        <app-card [class.hidden]="!verResumo && isMobile" [resumoMeses]="resumoMeses()" />
    </section>

    <main>
        <app-tabela
            [gastos]="gastos()"
            (gastoEditarOutput)="cadastrarAtualizarGasto($event)"
            (gastoDeletarOutput)="deletarGasto($event)"
            (datasEmissaoOutput)="buscarGastosPorData($event)"
        ></app-tabela>
    </main>
</div>
