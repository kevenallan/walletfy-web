<div class="flex flex-col h-full">
    <h1 class="font-bold text-2xl mt-20 ml-5 md:mt-5 md:text-4xl">Gastos</h1>
    <p class="text-cinza ml-5 md:mt-2">Gerencie todos os seus gastos registrados.</p>

    <div class="flex justify-end mr-3 my-1 md:my-3">
        <p-button
            icon="pi pi-plus"
            [label]="isMobile ? '' : 'Novo Gasto'"
            styleClass="bg-[#013729]! border-[#013729]! hover:!bg-green-600 dark:bg-green-600! hover:bg-green-400!"
            (click)="cadastrarAtualizarGasto()"
        />
    </div>

    <section>
        <app-card [cards]="cardConteudo()"></app-card>
    </section>

    <main>
        <app-tabela
            [gastos]="gastos()"
            (gastoEditarOutput)="cadastrarAtualizarGasto($event)"
        ></app-tabela>
    </main>
</div>
