<section class="shadow-lg rounded-lg p-5">
    <h2 class="font-bold text-lg">Meus Cartões</h2>
    <div class="flex flex-wrap gap-2">
        @for (cartao of cartoes(); track cartao.id) {
            <div
                class="shrink-0 shadow-lg text-branco p-3 rounded-lg w-69.75 md:w-100"
                [style.background-color]="cartao.banco?.cor ?? '#6b7280'"
            >
                <div class="flex justify-between">
                    <h3 class="font-semibold text-lg">{{ cartao.nome }}</h3>
                    <img
                        [src]="'/icons/bancos/' + (cartao.banco?.icone ?? 'generico') + '.png'"
                        [alt]="cartao.banco?.nome ?? cartao.nome"
                        class="border border-cinza w-10 h-10 rounded-lg"
                    />
                </div>

                <p class="">Fatura atual</p>
                <h3 class="text-2xl font-bold">{{ cartao.faturaAtual | currency: 'BRL' }}</h3>
                <span class="">
                    Limite disponível {{ cartao.limiteDisponivel | currency: 'BRL' }}
                </span>

                <div class="w-full">
                    <p-progressbar
                        [value]="cartao.percentualUsado"
                        [attr.aria-label]="cartao.percentualUsado + '% do limite utilizado'"
                        [pt]="{
                            root: { class: 'bg-cinza!' },
                            value: { class: 'bg-branco!' },
                            label: { class: 'text-preto! text-xs font-semibold' },
                        }"
                    />
                </div>

                <div class="flex-1 h-px bg-branco w-full my-3"></div>

                <div class="flex justify-between">
                    <span>Fecha dia {{ cartao.diaFechamento }}</span>
                    <span>Vence dia {{ cartao.diaVencimento }}</span>
                </div>
            </div>
        }

        <div class="shrink-0 border border-dotted rounded-lg w-69.75 md:w-100 h-53">
            <button class="w-full h-full cursor-pointer">
                <i class="pi pi-plus"></i>
                <p>Adicionar cartão</p>
            </button>
        </div>
    </div>
</section>
